<header class="top"><a class="brand" href="index.html"><span class="mark">💧</span><b>Under<span>Fy</span></b><i>•</i><b>UTA</b></a>
<nav><a class="on" href="musicas.html">Músicas</a><a class="" href="barras.html">Barras</a><a class="" href="stories.html">Stories</a><a class="" href="projetos.html">Projetos</a></nav>
<button class="account-btn" onclick="openAccount()"><span data-account-name>Entrar</span> ◯</button></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">PÁGINA DE MÚSICAS</div><h1>Guias</h1><p>As músicas são lidas diretamente de <b>musicas_ouvintes</b> e relacionadas aos artistas por <b>musica_artistas</b>. A consulta não ordena por created_at.</p></section>
<section class="section"><div class="head"><h2>Músicas</h2><button class="refresh" onclick="loadMusic()">Atualizar</button></div><div id="musicGrid" class="grid"><div class="loading">Carregando músicas...</div></div><div id="musicStatus" class="status"></div></section>
</main>
<footer><a href="index.html">Início</a><a href="musicas.html">Músicas</a><a href="barras.html">Barras</a><a href="stories.html">Stories</a><a href="projetos.html">Projetos</a></footer>
<div id="accountOverlay" class="overlay" onclick="if(event.target===this)closeAccount()"><div class="panel"><div class="panel-head"><h2>Conta</h2><button onclick="closeAccount()">×</button></div><div id="accountPanel"></div></div></div>
<script src="underfy.js"></script>
<script>
let musics=[], musicArtists=[], liked=new Set(), saved=new Set();
function artistsForMusic(m){
  const ids=musicArtists.filter(x=>String(x.musica_id)===String(m.id)).map(x=>String(x.artista_id));
  const names=ids.map(id=>window.artistsCache?.find(a=>String(a.id)===id)).filter(Boolean).map(nameOf);
  return names.length?names.join(" feat. "):(window.artistsCache||[]).find(a=>String(a.id)===String(artistIdOf(m)))?.nome||"Artista UnderFy";
}
async function loadMusic(){
  const [mr, ar, lr, sr] = await Promise.all([
    readPublic("musicas_ouvintes",500),
    readPublic("musica_artistas",1000),
    readPublic("artistas",500),
    getMyIds("musicas_curtidas","musica_id"),
    getMyIds("musicas_salvas","musica_id")
  ]);
  if(mr.error){setStatus("musicStatus","Erro em musicas_ouvintes: "+mr.error.message,true);document.getElementById("musicGrid").innerHTML='<div class="empty">Não foi possível carregar as músicas.</div>';return;}
  musics=(mr.data||[]).sort(sortNewest); musicArtists=ar.data||[]; window.artistsCache=ar.data||[];
  liked=lr; saved=sr;
  const filter=new URLSearchParams(location.search).get("artista");
  const list=filter?musics.filter(m=>String(artistIdOf(m))===String(filter)||musicArtists.some(x=>String(x.musica_id)===String(m.id)&&String(x.artista_id)===String(filter))):musics;
  document.getElementById("musicGrid").innerHTML=list.length?list.map(m=>{
    const id=String(m.id), l=liked.has(id), s=saved.has(id);
    return `<article class="card"><img class="cover" src="${esc(safeUrl(imageOf(m)||PH))}" onerror="this.src='${PH}'"><div class="info"><b>${esc(nameOf(m)||"Guia")}</b><span>${esc(artistsForMusic(m))}</span></div><div class="actions"><button class="round" onclick="playMusicById('${esc(id)}',musics)">▶ Ouvir</button><button class="round ${l?'active':''}" onclick="toggleMusic('${esc(id)}','like')">♡ ${l?'Curtida':'Curtir'}</button><button class="round ${s?'active':''}" onclick="toggleMusic('${esc(id)}','save')">▣ ${s?'Salva':'Salvar'}</button></div></article>`;
  }).join(""):'<div class="empty">Nenhuma música encontrada.</div>';
  setStatus("musicStatus",`${list.length} música(s) sincronizada(s) com o Supabase.`);
}
async function toggleMusic(id,type){
  const set=type==="like"?liked:saved, table=type==="like"?"musicas_curtidas":"musicas_salvas";
  const active=!set.has(String(id)); if(active)set.add(String(id));else set.delete(String(id));
  const ok=await toggleRelation(table,{ouvinte_id:currentUser?.id,musica_id:id},active);
  if(!ok){if(active)set.delete(String(id));else set.add(String(id));}
  await loadMusic();
}
(async()=>{await bootShared();await loadMusic();})();
</script>
