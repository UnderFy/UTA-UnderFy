info b,.info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info span{color:#777;font-size:11px;margin-top:4px}.actions{display:flex;gap:7px;margin-top:10px}.round,.btn{cursor:pointer;border-radius:20px;padding:9px 12px;background:#202020;color:#aaa}.round.active{color:#9cff00}.primary{background:#9cff00;color:#050505;font-weight:900}.danger{background:#35151b;color:#ff7184}.artist{min-width:140px;cursor:pointer}.artist img{width:140px;height:140px;border-radius:50%;object-fit:cover;background:#191919;border:1px solid #292929}.artist b{display:block;margin-top:8px}.artist small{color:#777}.project{display:flex;gap:12px;align-items:center;cursor:pointer}.project img{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#191919}.project span{display:block;color:#777;font-size:11px;margin-top:4px}.barra .btop{display:flex;gap:10px;align-items:center}.barra .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#222}.barra .text{margin-top:13px;color:#ddd;line-height:1.5;white-space:pre-wrap}.comments{margin-top:10px}.comments textarea{width:100%;min-height:70px;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:12px;padding:10px}.story{min-width:105px;text-align:center;cursor:pointer}.story-ring{width:82px;height:82px;margin:auto;padding:3px;border-radius:50%;background:linear-gradient(135deg,#9cff00,#666)}.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #080808;background:#222}.story b{display:block;margin-top:7px;font-size:12px}.story small{color:#777}.empty,.loading{border:1px dashed #303030;border-radius:16px;padding:24px;text-align:center;color:#666;width:100%}.status{color:#777;font-size:12px;margin:10px 0}.error{color:#ff7184}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end}.overlay.open{display:flex}.panel{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #333;border-radius:24px 24px 0 0;padding:20px;margin:auto auto 0}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head button{width:36px;height:36px;border-radius:50%;background:#222;color:#fff}.panel label{display:block;color:#888;font-size:11px;margin-top:12px}.panel input{display:block;width:100%;margin-top:6px;background:#0b0b0b;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}.panel .btn{display:block;width:100%;margin-top:9px}.account{display:flex;gap:12px;align-items:center;margin:10px 0 18px}.account img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#222}.account small{display:block;color:#777;margin-top:4px}.msg{color:#ff7184;font-size:12px;min-height:18px;margin-top:8px}footer{position:fixed;bottom:0;left:0;right:0;height:70px;z-index:60;background:rgba(10,10,10,.98);border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center}footer a{color:#777;font-size:11px}footer a:hover{color:#fff}.detail{background:#111;border:1px solid #292929;border-radius:20px;padding:18px}.story-view{background:#050505;border-radius:18px;min-height:65vh;display:grid;place-items:center;position:relative;overflow:hidden}.story-view img,.story-view video{max-width:100%;max-height:65vh;object-fit:contain}.story-caption{position:absolute;bottom:14px;left:14px;right:14px;background:rgba(0,0,0,.65);padding:12px;border-radius:12px}@media(max-width:700px){.top nav{display:none}.wrap{padding:15px 12px 35px}.hero{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.artist{min-width:115px}.artist img{width:115px;height:115px}.project img{width:76px;height:76px}}
</style></head><body>
<header class="top"><a class="brand" href="index.html"><span class="mark">💧</span><b>Under<span>Fy</span></b><i>•</i><b>UTA</b></a>
<nav><a class="" href="musicas.html">Músicas</a><a class="" href="barras.html">Barras</a><a class="on" href="stories.html">Stories</a><a class="" href="projetos.html">Projetos</a></nav>
<button class="account-btn" onclick="openAccount()"><span data-account-name>Entrar</span> ◯</button></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">PÁGINA DE STORIES</div><h1>Stories</h1><p>Stories públicos são lidos diretamente da tabela <b>stories</b>. O salvamento usa <b>stories_salvos</b> quando o usuário está autenticado.</p></section>
<section class="section"><div class="head"><h2>Ativos</h2><button class="refresh" onclick="loadStories()">Atualizar</button></div><div id="storyRow" class="row"><div class="loading">Carregando Stories...</div></div><div id="storyStatus" class="status"></div></section>
<div id="storyOverlay" class="overlay" onclick="if(event.target===this)closeStory()"><div class="panel"><div class="panel-head"><h2 id="storyTitle">Story</h2><button onclick="closeStory()">×</button></div><div id="storyViewer"></div></div></div>
</main>
<footer><a href="index.html">Início</a><a href="musicas.html">Músicas</a><a href="barras.html">Barras</a><a href="stories.html">Stories</a><a href="projetos.html">Projetos</a></footer>
<div id="accountOverlay" class="overlay" onclick="if(event.target===this)closeAccount()"><div class="panel"><div class="panel-head"><h2>Conta</h2><button onclick="closeAccount()">×</button></div><div id="accountPanel"></div></div></div>
<script src="underfy.js"></script>
<script>
let stories=[], storyIndex=0, storyList=[];
async function loadStories(){
  const [sr,ar,ss]=await Promise.all([readPublic("stories",500),readPublic("artistas",500),getMyIds("stories_salvos","story_id")]);
  if(sr.error){setStatus("storyStatus","Erro em stories: "+sr.error.message,true);return;}
  const now=Date.now();
  stories=(sr.data||[]).filter(s=>{const d=Date.parse(dateOf(s));return !d||now-d<=86400000;}).sort(sortNewest);
  window.artistsCache=ar.data||[];window.savedStories=ss;
  const groups={};stories.forEach(s=>{const aid=String(artistIdOf(s)||"sem-artista");(groups[aid]??=[]).push(s)});
  const ids=Object.keys(groups);
  document.getElementById("storyRow").innerHTML=ids.length?ids.map(aid=>{
    const a=window.artistsCache.find(x=>String(x.id)===aid), g=groups[aid];
    return `<div class="story" onclick="openStories('${esc(aid)}')"><div class="story-ring"><img src="${esc(safeUrl(imageOf(a)||imageOf(g[0])||PH))}" onerror="this.src='${PH}'"></div><b>${esc(nameOf(a)||val(g[0],["artista_nome"])||"Artista")}</b><small>${g.length} Story(s)</small></div>`;
  }).join(""):'<div class="empty">Nenhum Story publicado nas últimas 24 horas.</div>';
  setStatus("storyStatus",`${stories.length} Story(s) sincronizado(s).`);
}
function openStories(aid){
  storyList=stories.filter(s=>String(artistIdOf(s)||"sem-artista")===String(aid));storyIndex=0;renderStory();document.getElementById("storyOverlay").classList.add("open");
}
function closeStory(){document.getElementById("storyOverlay").classList.remove("open");}
function renderStory(){
  const s=storyList[storyIndex];if(!s)return;
  const media=storyMediaOf(s), type=String(val(s,["media_type","tipo_midia","tipo"])).toLowerCase();
  const video=type.includes("video")||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(media);
  const html=media?(video?`<video src="${esc(safeUrl(media))}" controls autoplay playsinline></video>`:`<img src="${esc(safeUrl(media))}" onerror="this.src='${PH}'">`):`<div class="empty">Este Story não possui mídia pública.</div>`;
  const saved=window.savedStories?.has(String(s.id));
  document.getElementById("storyViewer").innerHTML=`<div class="story-view">${html}<div class="story-caption">${esc(textOf(s))}<div style="margin-top:7px;color:#aaa">${storyIndex+1}/${storyList.length}</div></div></div><div class="actions"><button class="btn" onclick="prevStory()">Anterior</button><button class="btn" onclick="nextStory()">Próximo</button><button class="btn ${saved?'primary':''}" onclick="saveStory()">▣ ${saved?'Salvo':'Salvar'}</button></div>`;
}
function prevStory(){if(storyIndex>0){storyIndex--;renderStory()}}
function nextStory(){if(storyIndex<storyList.length-1){storyIndex++;renderStory()}else closeStory()}
async function saveStory(){
  const s=storyList[storyIndex];if(!s?.id){return}
  if(!currentUser){openAccount();return}
  const set=window.savedStories, active=!set.has(String(s.id));
  const ok=await toggleRelation("stories_salvos",{ouvinte_id:currentUser.id,story_id:s.id},active);
  if(ok){if(active)set.add(String(s.id));else set.delete(String(s.id));renderStory();}
}
(async()=>{await bootShared();await loadStories();})();
</script>
</body></html>
